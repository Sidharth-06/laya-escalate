[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-escalate"
version = "0.1.0"
description = "Calibration auditing for System One decision models: measures where published confidence is wrong, and ships the cheapest sufficient repair."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
laya = ["laya>=0.1"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["laya_escalate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
